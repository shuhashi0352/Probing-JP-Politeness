# Experiment
experiment:
  name: "baseline-classification-LineDistilBERT"
  output_dir: "./results_lineDistilBERT"
  seed: 42
  train_size: 0.7
  dev_size: 0.15
  test_size: 0.15

# Data
data:
  url: "https://raw.githubusercontent.com/Liumx2020/KeiCO-corpus/main/keico_corpus(forLREC)-OldVersion.csv"
  root_dir: "./data/"
  text_col: "text"
  label_col: "label"
  label_id_col: "label_id"
  honorific_col: "尊敬語"
  humble_col: "謙譲語"
  polite_col: "丁寧語"
  field_col: "フィールド"
  binary_data: "./data/das/politeness_dataset_1000_examples.json"
  binary_full_out: "./data/das/politeness_full_4800.json"
  binary_min_out: "./data/das/politeness_min_4800.json"
  das_out_dir: "./results_das"
  das_out_dev_name: "das_dev_results.json"

# Models
model:
  name: "line-corporation/line-distilbert-base-japanese"
  num_labels: 2

# for pytorch
torch:
  dtype: 

optimizer: 
  name: adamw
  lr: 2.0e-5
  weight_decay: 0.01

scheduler:
  name: "linear"
  warmup_steps: 0

# Training
task:
  num_classes: 2
  num_warmsteps: 0
  batch_size: 16
  num_epochs: 20
  learning_rate: 1.0e-5
  clean_text: False
  freeze_encoder: True

tokenizer:
  name: "line-corporation/line-distilbert-base-japanese"
  truncation: True
  return_tensors: "pt"
  trust_remote_code: True
  padding_strategy: "max_length"
  max_length: 128

das:
  k: 128
  lr: 0.001
  epochs: 20

tr_probe:
  lr: 0.0001
  epochs: 100
  batch_size: 16
  weight_decay: 0.01

